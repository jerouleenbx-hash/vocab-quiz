<div class="word-table-container">
<table class="word-table">
  <thead>
    <tr>
      <th [attr.aria-sort]="sortColumn === 'word' ? (sortDirection === 'asc' ? 'ascending' : 'descending') : 'none'">
        <button class="sort-button" type="button" (click)="toggleSort('word')">
          Word <span aria-hidden="true">{{ sortColumn === 'word' ? (sortDirection === 'asc' ? ' ▲' : ' ▼') : '' }}</span>
        </button>
      </th>
      <th [attr.aria-sort]="sortColumn === 'definition' ? (sortDirection === 'asc' ? 'ascending' : 'descending') : 'none'">
        <button class="sort-button" type="button" (click)="toggleSort('definition')">
          Definition<span aria-hidden="true">{{ sortColumn === 'definition' ? (sortDirection === 'asc' ? ' ▲' : ' ▼') : '' }}</span>
        </button>
      </th>
      <th [attr.aria-sort]="sortColumn === 'example_sentence' ? (sortDirection === 'asc' ? 'ascending' : 'descending') : 'none'">
        <button class="sort-button" type="button" (click)="toggleSort('example_sentence')">
          Exemple<span aria-hidden="true">{{ sortColumn === 'example_sentence' ? (sortDirection === 'asc' ? ' ▲' : ' ▼') : '' }}</span>
        </button>
      </th>
      <th [attr.aria-sort]="sortColumn === 'type' ? (sortDirection === 'asc' ? 'ascending' : 'descending') : 'none'">
        <button class="sort-button" type="button" (click)="toggleSort('type')">
          Type<span aria-hidden="true">{{ sortColumn === 'type' ? (sortDirection === 'asc' ? ' ▲' : ' ▼') : '' }}</span>
        </button>
      </th>
    </tr>
  </thead>
  <tbody>
    @for (word of words$ | async; track word.id) {
      <tr [class.revealed]="isRevealed(word)" (click)="toggleReveal(word)">
        <td>
          <div class="word-title-container">

            <div
              class="score-dot"
              [ngStyle]="{'background-color': getScoreColor(word)}"
            ></div>
            <span>{{ word.word }} </span>
          </div>
        </td>
        <td>
            <div class="word-details">
              <p>{{ word.definition }}</p>
            </div>
        </td>
        <td>
          @if (word.example_sentence) {
            <p>{{ word.example_sentence }}</p>
          }
        </td>
        <td>{{ word.type }}</td>
      </tr>
    }
  </tbody>
</table>
</div>
