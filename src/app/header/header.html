<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<header>
  <nav>
    <div class="menu-container">

      <!-- Bouton SWITCH 
      <a
        mat-button
        class="menu-item"
        (click)="switch()"
        [ngStyle]="{'background-color': wordButtonColors[1]}"
      <a
        mat-button
        class="menu-item"
        (click)="goToExercises()"
        [ngStyle]="{'background-color': wordButtonColors[1]}"
        [class.active-action]="selectedAction === 'exercises'">
        Exercices
      </a>

        [class.active-action]="selectedAction === 'list'">
        Switch
      </a>
    -->
      

      <!-- Titre -->
      <div class="menu-title">
        Vocabulary
      </div>

      <!-- Select Category -->
      <div class="menu-item">
        <select
          id="category-select"
          aria-label="Category"
          (change)="onCategoryChangeFromEvent($event)"
          [value]="selectedCategory">

          <option value="" disabled>Select a category</option>
          <option value="All">All categories</option>
          <option *ngFor="let category of categories$ | async" [value]="category">
            {{ category }}
          </option>

        </select>
      </div>

      <!-- Select Tag -->
      <div class="menu-item">
        <select
          id="tag-select"
          aria-label="Tag"
          (change)="onTagChangeFromEvent($event)"
          [value]="selectedTag">

          <option value="" disabled>Select a tag</option>
          <option value="All">All tags</option>
          <option *ngFor="let tag of tags$ | async" [value]="tag">
            {{ tag }}
          </option>

        </select>
      </div>

      <!-- Select Type -->
      <div class="menu-item">
        <select
          id="type-select"
          aria-label="Type"
          (change)="onTypeChangeFromEvent($event)"
          [value]="selectedType">

          <option value="All">All types</option>
          <option *ngFor="let type of types$ | async" [value]="type">
            {{ type }}
          </option>

        </select>
      </div>

      <!-- Bouton LIST -->
      <a
        mat-button
        class="menu-item"
        (click)="goToList()"
        [ngStyle]="{'background-color': wordButtonColors[1]}"
        [class.active-action]="selectedAction === 'list'">
        List
      </a>


      <!-- Bouton LIST TABLE-->
      <a
        mat-button
        class="menu-item"
        (click)="goToTable()"
        [ngStyle]="{'background-color': wordButtonColors[1]}"
        [class.active-action]="selectedAction === 'table'">
        Table
      </a>

      <a
        mat-button
        class="menu-item"
        (click)="goToExercises()"
        [ngStyle]="{'background-color': wordButtonColors[1]}"
        [class.active-action]="selectedAction === 'exercises'">
        Exercices
      </a>

      <!-- Bouton QUIZ DEF -->
      <a
        mat-button
        class="menu-item"
        (click)="goToQuizDefinition()"
        [ngStyle]="{'background-color': wordButtonColors[1]}"
        [class.active-action]="selectedAction === 'quizDef'">
        Quizz Definition
      </a>

      <!-- Bouton QUIZ WORD -->
      <a
        mat-button
        class="menu-item"
        (click)="goToQuizWord()"
        [ngStyle]="{'background-color': wordButtonColors[1]}"
        [class.active-action]="selectedAction === 'quizWord'">
        Quizz Word
      </a>

     <div class="word-section">

  <!-- Bouton Load -->
  <label class="upload-btn">
    <i class="fas fa-upload"></i>
    <input type="file" (change)="onFileSelected($event)" accept=".csv" />
  </label>


<!-- Popup -->
<div class="popup" [class.show]="showPopup">
  <div class="popup-content">
    <p>{{ popupMessage }}</p>
    <button (click)="closePopup()">OK</button>
  </div>
</div>
</div>

    </div>
  </nav>
</header>
